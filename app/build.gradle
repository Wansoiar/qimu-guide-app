apply plugin: 'com.android.application'

// 环境选择：-PqimuEnv=dev 或环境变量 QIMU_ENV=dev 走本地联调；默认 prod 走线上。
def qimuEnv = (project.findProperty('qimuEnv') ?: System.getenv('QIMU_ENV') ?: 'prod')
        .toString().trim().toLowerCase(Locale.ROOT)
if (!(qimuEnv in ['dev', 'prod'])) {
    throw new GradleException("qimuEnv 仅支持 dev 或 prod，当前值：${qimuEnv}")
}

// 读取项目根 local.properties（已被 .gitignore 忽略，仅本机使用）
def readLocalProperties() {
    def props = new Properties()
    def f = rootProject.file('local.properties')
    if (f.exists()) f.withInputStream { props.load(it) }
    return props
}

// App 共享密钥解析（仓库内不存放 prod 真实密钥）：
// 优先级：Gradle 属性(-P / gradle.properties) > 环境变量 > local.properties > dev 内置兜底。
// prod 缺失时直接报错并提示配置位置，避免带错误密钥出包。
def resolveAppSharedSecret(String environment) {
    def v = project.findProperty('QIMU_APP_SHARED_SECRET')
            ?: System.getenv('QIMU_APP_SHARED_SECRET')
            ?: readLocalProperties().getProperty('QIMU_APP_SHARED_SECRET')
    if (v && v.toString().trim()) return v.toString().trim()
    if (environment == 'dev') return 'dev-app-shared-secret-change-in-prod' // dev 密钥非机密，仅联调用
    throw new GradleException("""
        QIMU_APP_SHARED_SECRET 未配置（prod 构建必须显式提供 App 共享密钥）：
          · 本地：在 ~/.gradle/gradle.properties 或项目 local.properties 添加
                 QIMU_APP_SHARED_SECRET=<线上密钥>
          · CI：在 Secrets 配置 QIMU_APP_SHARED_SECRET，构建步骤 env 注入
    """.stripIndent())
}

def productionApiBaseUrl = 'https://api.equavision.cn'
def requestedApiBaseUrl = project.findProperty('QIMU_API_BASE_URL')
        ?: System.getenv('QIMU_API_BASE_URL')
def normalizeApiBaseUrl = { value ->
    value.toString().trim().replaceAll('/+$', '')
}
def qimuApiBaseUrl
if (qimuEnv == 'prod') {
    if (requestedApiBaseUrl
            && normalizeApiBaseUrl(requestedApiBaseUrl) != productionApiBaseUrl) {
        throw new GradleException(
                "prod 构建只允许 ${productionApiBaseUrl}，禁止通过 IP、HTTP 或其他地址覆盖")
    }
    qimuApiBaseUrl = productionApiBaseUrl
} else {
    qimuApiBaseUrl = normalizeApiBaseUrl(requestedApiBaseUrl ?: 'http://127.0.0.1:8787')
}
def qimuAppSharedSecret = resolveAppSharedSecret(qimuEnv)
def asBuildConfigString = { value ->
    '"' + value.toString().replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    compileSdk 35

    // 眼镜私有全双工收音的探索性实现（未接主链路、当前不编译：引用了尚未定义的
    // RtcVoiceChatManager.AI_DIALOGUE_AUDIO_MODE / CAPTURE_MODE）。先排除出编译，
    // 让 SCO 全双工自测（ScoFullDuplexProbe）能跑；决定走私有通道时再补常量并移除本排除。
    sourceSets {
        main {
            java {
                exclude 'com/qimu/guide/service/GlassesAiDialogueAudioSource.java'
                exclude 'com/qimu/guide/service/GlassesNormalStreamAudioSource.java'
                exclude 'com/qimu/guide/service/GlassesNavAudioSource.java'
                exclude 'com/qimu/guide/service/GlassesAudioSource.java'
            }
        }
    }

    defaultConfig {
        applicationId "com.qimu.guide"
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName "1.1.1"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        multiDexEnabled = true
        ndk {
            abiFilters 'arm64-v8a'
        }
        buildConfigField 'String', 'API_BASE_URL', asBuildConfigString(qimuApiBaseUrl)
        buildConfigField 'boolean', 'IS_PRODUCTION_ENV', qimuEnv == 'prod' ? 'true' : 'false'
        buildConfigField 'String', 'APP_SHARED_SECRET', asBuildConfigString(qimuAppSharedSecret)
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    namespace 'com.qimu.guide'

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'

    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.google.protobuf:protobuf-java:4.29.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.artillery.pay:paycertification:leadingSmart_1.0.55'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // 火山引擎 RTC SDK（feat/volc-rtc）：手机进房与 AI 智能体实时语音对话
    implementation 'com.volcengine:VolcEngineRTC:3.60.105.3500'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
