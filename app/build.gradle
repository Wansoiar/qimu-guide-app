apply plugin: 'com.android.application'

def qimuApiBaseUrl = project.findProperty('QIMU_API_BASE_URL')
        ?: System.getenv('QIMU_API_BASE_URL')
        ?: 'http://115.190.147.152:8787'
def qimuShareAppToken = project.findProperty('QIMU_SHARE_APP_TOKEN')
        ?: System.getenv('QIMU_SHARE_APP_TOKEN')
        ?: ''
def asBuildConfigString = { value ->
    '"' + value.toString().replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.qimu.guide"
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName "1.1.1"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        multiDexEnabled = true
        buildConfigField 'String', 'API_BASE_URL', asBuildConfigString(qimuApiBaseUrl)
        buildConfigField 'String', 'SHARE_APP_TOKEN', asBuildConfigString(qimuShareAppToken)
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    namespace 'com.qimu.guide'

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'

    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.google.protobuf:protobuf-java:4.29.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.artillery.pay:paycertification:leadingSmart_1.0.55'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // 火山引擎 RTC SDK（feat/volc-rtc）：手机进房与 AI 智能体实时语音对话
    implementation 'com.volcengine:VolcEngineRTC:3.60.105.3500'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
